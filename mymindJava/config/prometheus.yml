global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: mymind-java
    environment: production

scrape_configs:
  - job_name: mymind-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - mymind-java:8080
        labels:
          service: mymind-java

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
