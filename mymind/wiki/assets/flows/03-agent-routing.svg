<text x="612" y="959" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#203148">Technical / Billing 全实例 penalty ≥ 阈值；</text>
