<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2520" viewBox="0 0 1800 2520">
<rect width="1800" height="100%" fill="white"/>
<text x="70" y="35" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="48" font-weight="700" fill="#203148">03  主辅 Agent 路由</text>
<text x="70" y="107" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" fill="#64748b">先澄清，再处理升级；主领域与辅助领域共享监控可用性筛选</text>
