<text x="632" y="464" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#203148">通过后进入 handler；工具 top_k 约束为 1–20</text>
